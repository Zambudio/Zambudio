<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Zambudio — Industrial Simulation, Automation and AI</title>
  <desc id="desc">A futuristic industrial digital twin connected to an artificial intelligence network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0A1930"/>
      <stop offset="1" stop-color="#11102A"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="80" x2="1010" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2FF4E9"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(942 206) rotate(90) scale(180 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#6EA8FF" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="942" cy="206" rx="250" ry="210" fill="url(#glow)"/>
    <path d="M0 350C221 300 363 407 565 358C793 303 936 319 1200 263V420H0V350Z" fill="#0B263C" fill-opacity="0.9"/>
    <path d="M0 374C234 323 398 420 620 365C842 310 1018 347 1200 298" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>

    <!-- Brand and message -->
    <g transform="translate(74 69)">
      <rect width="54" height="6" rx="3" fill="url(#accent)"/>
      <text x="0" y="61" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="1">PEDRO ZAMBUDIO</text>
      <text x="2" y="101" fill="#9FEDE9" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3">ENGINEERING INTELLIGENCE INTO REAL SYSTEMS</text>
      <text x="2" y="148" fill="#C9D6E8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Industrial Simulation  ×  Automation  ×  Artificial Intelligence</text>

      <g transform="translate(0 188)" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" letter-spacing="1">
        <rect width="145" height="38" rx="19" fill="#123149" stroke="#2FF4E9" stroke-opacity="0.55"/>
        <text x="72.5" y="24" fill="#B7FFF9" text-anchor="middle">DIGITAL TWINS</text>
        <rect x="158" width="126" height="38" rx="19" fill="#142D52" stroke="#60A5FA" stroke-opacity="0.6"/>
        <text x="221" y="24" fill="#BFDBFE" text-anchor="middle">AI AGENTS</text>
        <rect x="297" width="145" height="38" rx="19" fill="#251E4D" stroke="#C084FC" stroke-opacity="0.55"/>
        <text x="369.5" y="24" fill="#E9D5FF" text-anchor="middle">INDUSTRIAL IOT</text>
      </g>
    </g>

    <!-- Digital twin / AI visual -->
    <g transform="translate(785 55)">
      <circle cx="160" cy="150" r="124" stroke="#4D79B5" stroke-opacity="0.24"/>
      <circle cx="160" cy="150" r="91" stroke="#60A5FA" stroke-opacity="0.28" stroke-dasharray="5 8"/>
      <path d="M111 112L160 82L209 112V170L160 200L111 170V112Z" fill="#0B1F38" stroke="url(#accent)" stroke-width="2"/>
      <path d="M111 112L160 142L209 112M160 142V200" stroke="#74DFF2" stroke-opacity="0.72" stroke-width="2"/>
      <circle cx="160" cy="142" r="10" fill="#2FF4E9" filter="url(#softGlow)"/>
      <circle cx="160" cy="27" r="5" fill="#60A5FA" filter="url(#softGlow)"/>
      <circle cx="272" cy="92" r="5" fill="#A855F7" filter="url(#softGlow)"/>
      <circle cx="258" cy="222" r="5" fill="#2FF4E9" filter="url(#softGlow)"/>
      <circle cx="55" cy="237" r="5" fill="#60A5FA" filter="url(#softGlow)"/>
      <circle cx="40" cy="88" r="5" fill="#2FF4E9" filter="url(#softGlow)"/>
      <path d="M160 82V27M209 112L272 92M209 170L258 222M111 170L55 237M111 112L40 88" stroke="url(#accent)" stroke-opacity="0.68" stroke-width="2"/>
      <path d="M128 236H192L210 272H110L128 236Z" fill="#101C32" stroke="#6687BA" stroke-opacity="0.7"/>
      <path d="M142 236V219H178V236M160 219V200" stroke="#74DFF2" stroke-width="2"/>
      <rect x="121" y="272" width="78" height="12" rx="6" fill="#1A3553" stroke="#60A5FA" stroke-opacity="0.55"/>
    </g>

    <text x="1124" y="388" text-anchor="end" fill="#71839B" font-family="Consolas, monospace" font-size="13">BUILD · SIMULATE · AUTOMATE · LEARN</text>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="2"/>
</svg>
